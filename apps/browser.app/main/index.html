<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器</title>
    <link rel="stylesheet" href="/apps/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="browser">
        <div class="toolbar">
            <div class="nav-buttons">
                <button class="nav-btn" id="back-btn" title="后退">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
                <button class="nav-btn" id="forward-btn" title="前进">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </button>
                <button class="nav-btn" id="refresh-btn" title="刷新">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"/>
                        <polyline points="1 20 1 14 7 14"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                </button>
                <button class="nav-btn" id="new-tab-btn" title="新标签页">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
            <div class="tabs-container" id="tabs-container"></div>
            <div class="address-bar-container">
                <input type="text" id="address-input" class="address-bar" placeholder="输入网址或搜索...">
                <button class="go-btn" id="go-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="bookmarks-bar" id="bookmarks-bar"></div>
        <div class="status-bar">
            <span id="status-text">就绪</span>
        </div>
        <div class="content-area" id="content-area">
            <iframe id="browser-frame" src="about:blank" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-modals"></iframe>
        </div>
        <div class="iframe-error" id="iframe-error">
            <div class="error-content">
                <div class="error-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                </div>
                <div class="error-title">无法嵌入显示此页面</div>
                <div class="error-message" id="error-message">该网站不允许在嵌入式浏览器中显示</div>
                <div class="error-hint">大多数主流网站（Apple、Google、GitHub 等）设置了 X-Frame-Options 或 CSP 安全策略，禁止被 iframe 嵌入。这是浏览器安全限制，纯前端无法绕过。</div>
                <div class="error-actions">
                    <button class="error-btn" id="retry-btn">重试</button>
                    <button class="error-btn primary" id="open-external-btn">在新窗口打开</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
