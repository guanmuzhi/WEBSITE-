<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理器</title>
    <link rel="stylesheet" href="/apps/common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="filemanager">
        <div class="fm-toolbar">
            <button class="btn" id="fm-back" title="返回上级">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
            </button>
            <button class="btn" id="fm-home" title="根目录">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </button>
            <div class="fm-path" id="fm-path">/</div>
            <button class="btn" id="fm-refresh" title="刷新">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
            </button>
            <div class="fm-toolbar-divider"></div>
            <button class="btn" id="fm-new-folder" title="新建文件夹">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    <path d="M12 11v6"/>
                    <path d="M9 14h6"/>
                </svg>
            </button>
            <button class="btn" id="fm-new-file" title="新建文件">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <path d="M12 11v6"/>
                    <path d="M9 14h6"/>
                </svg>
            </button>
            <button class="btn" id="fm-upload" title="上传文件">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </button>
            <button class="btn" id="fm-paste" title="粘贴" style="display:none;">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 15v2"/>
                    <path d="M8 21h8"/>
                    <path d="M19 21h2c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1h-2"/>
                    <path d="M12 17v-4"/>
                    <path d="M8 13H6c-.55 0-1-.45-1-1V3c0-.55.45-1 1-1h2"/>
                </svg>
            </button>
        </div>
        <div class="fm-sidebar">
            <div class="fm-sidebar-title">位置</div>
            <div class="fm-sidebar-item" data-path="/">根目录</div>
            <div class="fm-sidebar-item" data-path="/home">home</div>
            <div class="fm-sidebar-item" data-path="/tmp">tmp</div>
        </div>
        <div class="fm-main">
            <div class="fm-filelist" id="fm-filelist"></div>
        </div>
        <div class="fm-viewer" id="fm-viewer" style="display:none;">
            <div class="fm-viewer-header">
                <span class="fm-viewer-title" id="fm-viewer-title"></span>
                <button class="fm-btn" id="fm-viewer-close">关闭</button>
            </div>
            <pre class="fm-viewer-content" id="fm-viewer-content"></pre>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
